# codex.toml

model = "gpt-5.6-sol"
model_verbosity = "low"
model_reasoning_effort = "max"
hide_agent_reasoning = true
suppress_unstable_features_warning = true
# WezTerm では ASCII 入力を貼り付け候補として一時保留せず、受信時に挿入する。
disable_paste_burst = true

# 通知（Linux例：成功音）。macOSなら:
# notify = ["bash", "-lc", "afplay /System/Library/Sounds/Ping.aiff"]
notify = ["bash", "-lc", "paplay /usr/share/sounds/freedesktop/stereo/complete.oga || aplay /usr/share/sounds/alsa/Front_Center.wav || true"]
personality = "pragmatic"

tools.web_search = true
service_tier = "default"
plan_mode_reasoning_effort = "max"
# [tools.web_search]
# enabled = true

[sandbox_workspace_write]
network_access = true

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]
# stdio MCP はサブエージェントごとに複製されるため、通常は停止する。
# 必要なセッションだけ `codex -p devtools` で有効化する。
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

# Notion MCP は OAuth ログイン済みで使うときだけ有効化する。
# 再有効化: codex mcp add notion --url https://mcp.notion.com/mcp
# 認証: codex mcp login notion
# [mcp_servers.notion]
# url = "https://mcp.notion.com/mcp"

