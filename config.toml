[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '/usr/bin/python3 "$HOME/.codex/hooks/codex_env_guard.py" pre-tool-use'
timeout = 10
statusMessage = "checking env files"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '/usr/bin/python3 "$HOME/.codex/hooks/codex_readme_guard.py" start'
timeout = 10
statusMessage = "recording README baseline"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '/usr/bin/python3 "$HOME/.codex/hooks/codex_memo_guard.py" stop'
timeout = 10
statusMessage = "checking README and queueing memo"

